name: Sync configured airdrop source observations

on:
  workflow_dispatch:
  schedule:
    # 08:00 Asia/Shanghai (00:00 UTC), gated by source-rights and production configuration.
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: airdrop-discovery-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.AIRDROP_DISCOVERY_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install discovery importer
        run: pip install .
      - name: Sync configured source observations
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::notice::Discovery sync is not configured; skipping."
            exit 0
          fi
          python -m scripts.sync_airdrop_hub
