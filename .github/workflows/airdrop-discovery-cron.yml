name: Sync approved airdrop discovery sources

on:
  schedule:
    # 08:17 Asia/Shanghai (UTC+8); best-effort GitHub scheduled execution.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airdrop-discovery-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.AIRDROP_DISCOVERY_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AIRDROP_RSS_FEEDS: ${{ vars.AIRDROP_RSS_FEEDS }}
      AIRDROP_RSS_ALLOWED_HOSTS: ${{ vars.AIRDROP_RSS_ALLOWED_HOSTS }}
      AIRDROP_RSS_APPROVED_SOURCES: ${{ vars.AIRDROP_RSS_APPROVED_SOURCES }}
      AIRDROP_HUB_SOURCE_APPROVED: ${{ vars.AIRDROP_HUB_SOURCE_APPROVED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install discovery importer
        run: pip install .
      - name: Sync approved sources
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::notice::Discovery sync is not configured; skipping."
            exit 0
          fi
          python -m scripts.sync_airdrop_hub
