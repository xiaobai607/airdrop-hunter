name: Android debug build and backend tests

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      scope:
        description: Which verification suite to run
        required: true
        type: choice
        default: both
        options:
          - both
          - android
          - backend

# Keep only the newest validation for a given PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_ACTION: ${{ github.event.action }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          MANUAL_SCOPE: ${{ inputs.scope || 'both' }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$MANUAL_SCOPE" == "both" || "$MANUAL_SCOPE" == "android" ]]; then
              echo "android=true" >> "$GITHUB_OUTPUT"
            else
              echo "android=false" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$MANUAL_SCOPE" == "both" || "$MANUAL_SCOPE" == "backend" ]]; then
              echo "backend=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Same-repository PR synchronize events are paired with the push event
          # for the exact before/after commit range. Avoid running the same suites twice.
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" == "$GITHUB_REPOSITORY" && "$PR_ACTION" == "synchronize" ]]; then
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "Same-repository synchronize is covered by the corresponding push event."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
              git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER" > changed-files.txt
              echo "Checking exact push range: $PUSH_BEFORE..$PUSH_AFTER"
            else
              # New branch: compare its complete tree with the merge base on main.
              diff_base="$(git merge-base origin/main "$PUSH_AFTER")"
              git diff --name-only "$diff_base" "$PUSH_AFTER" > changed-files.txt
              echo "New branch; checking from main merge base $diff_base"
            fi
          else
            # First PR validation, reopen, or fork PR synchronize: validate the
            # complete PR diff. Fork updates have no base-repository push event.
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
            echo "Checking complete PR diff: $BASE_SHA...$HEAD_SHA"
          fi
          if grep -Eq '^(android/|gradle/|gradlew$|settings\.gradle|build\.gradle|gradle\.properties$)' changed-files.txt; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(backend/|database/|docker-compose\.yml$|render\.yaml$)' changed-files.txt; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airdrop_hunter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d airdrop_hunter"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/airdrop_hunter
      JWT_SECRET_KEY: github-actions-test-secret-key-at-least-32-characters
      JWT_EXPIRE_MINUTES: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - run: pytest -q

  android-build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK and run unit tests
        working-directory: android
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          COMMUNITY_SNAPSHOT_BASE_URL: ${{ vars.COMMUNITY_SNAPSHOT_BASE_URL }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: airdrop-hunter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
