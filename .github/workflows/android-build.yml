name: Android debug build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Bootstrap the official Gradle Wrapper from the pinned Gradle version.
      # Commit the generated gradlew, gradlew.bat, wrapper JAR and properties
      # to the repository in a follow-up once generated in a trusted environment.
      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK with Wrapper
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-hunter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
