name: Android debug build and backend tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      scope:
        description: Which verification suite to run
        required: true
        type: choice
        default: both
        options:
          - both
          - android
          - backend

# Keep only the newest validation for a given PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_SCOPE: ${{ inputs.scope || 'both' }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$MANUAL_SCOPE" == "both" || "$MANUAL_SCOPE" == "android" ]]; then
              echo "android=true" >> "$GITHUB_OUTPUT"
            else
              echo "android=false" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$MANUAL_SCOPE" == "both" || "$MANUAL_SCOPE" == "backend" ]]; then
              echo "backend=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Compare only changes since the last fully successful validation of this PR.
          # If no successful baseline exists, or this is a manual rerun, validate the
          # complete PR diff so cancelled/failed work can never hide untested changes.
          diff_base="$BASE_SHA"
          compare_full_pr=true
          if [[ "$RUN_ATTEMPT" -gt 1 ]]; then
            echo "Rerun attempt detected; using the complete PR diff."
          elif [[ -n "$PR_NUMBER" ]]; then
            if runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-build.yml/runs" -f branch="$HEAD_REF" -f event=pull_request -F per_page=100 2>/dev/null)"; then
              previous_sha="$(jq -r --arg run_id "$RUN_ID" --arg pr_number "$PR_NUMBER" '
                [.workflow_runs[]?
                  | select((.id | tostring) != $run_id)
                  | select(.status == "completed" and .conclusion == "success")
                  | select(any(.pull_requests[]?; (.number | tostring) == $pr_number))]
                | .[0].head_sha // empty
              ' <<< "$runs_json")"
              if [[ -n "$previous_sha" ]]; then
                if ! git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
                  git fetch --no-tags origin "$previous_sha" || true
                fi
                if git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
                  diff_base="$previous_sha"
                  compare_full_pr=false
                  echo "Using last successful PR validation as the change baseline: $previous_sha"
                else
                  echo "::warning::Previous successful head is unavailable locally; falling back to the complete PR diff."
                fi
              else
                echo "No previous successful run for this PR; using the complete PR diff."
              fi
            else
              echo "::warning::Could not read previous workflow runs; falling back to the complete PR diff."
            fi
          fi

          if [[ "$compare_full_pr" == "true" ]]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          else
            git diff --name-only "$diff_base" "$HEAD_SHA" > changed-files.txt
          fi
          if grep -Eq '^(android/|gradle/|gradlew$|settings\.gradle|build\.gradle|gradle\.properties$)' changed-files.txt; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(backend/|database/|docker-compose\.yml$|render\.yaml$)' changed-files.txt; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airdrop_hunter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d airdrop_hunter"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/airdrop_hunter
      JWT_SECRET_KEY: github-actions-test-secret-key-at-least-32-characters
      JWT_EXPIRE_MINUTES: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - run: pytest -q

  android-build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK and run unit tests
        working-directory: android
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          COMMUNITY_SNAPSHOT_BASE_URL: ${{ vars.COMMUNITY_SNAPSHOT_BASE_URL }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: airdrop-hunter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
